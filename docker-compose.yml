services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carbon_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carbon_password}
      POSTGRES_DB: ${POSTGRES_DB:-carbon_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-carbon_user} -d $${POSTGRES_DB:-carbon_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-carbon_user}:${POSTGRES_PASSWORD:-carbon_password}@db:5432/${POSTGRES_DB:-carbon_db}
      - SECRET_KEY=${SECRET_KEY:-a_very_secure_secret_key_in_production_environment_abc123}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
